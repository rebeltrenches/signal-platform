# Local dev infrastructure only. Production deployment (managed Postgres,
# managed Redis, real RPC providers) is a DEPLOYMENT.md decision, not this
# file's job — spec section 40.
version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: launchpad
      POSTGRES_PASSWORD: launchpad_dev_only
      POSTGRES_DB: launchpad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchpad"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
