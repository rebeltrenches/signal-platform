name: Apply launch-fee hardening

on:
  push:
    branches:
      - pf-style-bonding-curve
    paths:
      - '.github/workflows/apply-launch-fee-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pf-style-bonding-curve
          fetch-depth: 0

      - name: Apply protocol-level launch-fee hardening
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def replace_once(path, old, new, label):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match in {path}, found {count}')
              path.write_text(text.replace(old, new, 1))

          # --- Solana program: bind and collect the fixed launch fee itself. ---
          rust = ROOT / 'programs/signal-bonding-curve/src/lib.rs'
          replace_once(
              rust,
              'const SIGNAL_FEE_BPS: u128 = 100; // 1% of each Signal curve trade\nconst MINIMUM_TOKEN_SUPPLY_WHOLE: u64 = 100_000_000;',
              'const SIGNAL_FEE_BPS: u128 = 100; // 1% of each Signal curve trade\nconst LAUNCH_FEE_LAMPORTS: u64 = 1_000_000; // 0.001 SOL, enforced during curve initialization\nconst MINIMUM_TOKEN_SUPPLY_WHOLE: u64 = 100_000_000;',
              'add launch fee constant',
          )
          replace_once(
              rust,
              '    let curve_vault = next_account_info(&mut it)?;\n    let creator = next_account_info(&mut it)?;\n    let token_program = next_account_info(&mut it)?;\n    let system_program_info = next_account_info(&mut it)?;',
              '    let curve_vault = next_account_info(&mut it)?;\n    let creator = next_account_info(&mut it)?;\n    let platform_wallet = next_account_info(&mut it)?;\n    let token_program = next_account_info(&mut it)?;\n    let system_program_info = next_account_info(&mut it)?;',
              'add launch fee account',
          )
          replace_once(
              rust,
              '    if !creator.is_signer || !creator.is_writable { return Err(ProgramError::MissingRequiredSignature); }\n    if token_program.key != &spl_token::id() || mint.owner != token_program.key || system_program_info.key != &system_program::id() {\n        return Err(ProgramError::IncorrectProgramId);\n    }',
              '    if !creator.is_signer || !creator.is_writable { return Err(ProgramError::MissingRequiredSignature); }\n    if platform_wallet.key != &PLATFORM_WALLET || !platform_wallet.is_writable {\n        return Err(ProgramError::InvalidAccountData);\n    }\n    if token_program.key != &spl_token::id() || mint.owner != token_program.key || system_program_info.key != &system_program::id() {\n        return Err(ProgramError::IncorrectProgramId);\n    }',
              'bind launch fee recipient',
          )
          replace_once(
              rust,
              '    if vault.owner != expected_curve || vault.mint != *mint.key || vault.amount != total_supply {\n        return Err(ProgramError::InvalidAccountData);\n    }\n\n    let (real_tokens, virtual_tokens) = initial_reserves(total_supply)?;',
              '    if vault.owner != expected_curve || vault.mint != *mint.key || vault.amount != total_supply {\n        return Err(ProgramError::InvalidAccountData);\n    }\n\n    // Charge only after every launch invariant above is validated. The transfer\n    // and curve-account creation are in the same outer transaction, so any later\n    // failure rolls the fee back atomically. Direct callers cannot bypass it.\n    invoke(\n        &system_instruction::transfer(creator.key, platform_wallet.key, LAUNCH_FEE_LAMPORTS),\n        &[creator.clone(), platform_wallet.clone(), system_program_info.clone()],\n    )?;\n\n    let (real_tokens, virtual_tokens) = initial_reserves(total_supply)?;',
              'collect launch fee atomically',
          )

          # --- Browser launcher: stop charging early; pass the bound treasury to initialize. ---
          launch = ROOT / 'apps/web/src/client/launch-solana-curve.js'
          replace_once(
              launch,
              'const LAUNCH_FEE_LAMPORTS = 1_000_000; // current Signal launch charge: 0.001 SOL\n',
              '',
              'remove browser launch fee constant',
          )
          replace_once(
              launch,
              '      web3.SystemProgram.transfer({ fromPubkey: payer, toPubkey: PLATFORM_WALLET, lamports: LAUNCH_FEE_LAMPORTS }),\n',
              '',
              'remove early browser launch fee transfer',
          )
          replace_once(
              launch,
              '        { pubkey: creator, isSigner: true, isWritable: true },\n        { pubkey: splToken.TOKEN_PROGRAM_ID, isSigner: false, isWritable: false },',
              '        { pubkey: creator, isSigner: true, isWritable: true },\n        { pubkey: PLATFORM_WALLET, isSigner: false, isWritable: true },\n        { pubkey: splToken.TOKEN_PROGRAM_ID, isSigner: false, isWritable: false },',
              'pass platform wallet to initialize',
          )

          # --- Runtime tests: every initialize call now supplies the treasury account. ---
          tests = sorted((ROOT / 'apps/web/tests').glob('bonding-curve-*.mjs'))
          init_pattern = re.compile(
              r'(?P<indent>^[ \t]*)\{ pubkey: (?P<who>creator(?:\.publicKey)?|payer\.publicKey), isSigner: true, isWritable: true \},\n'
              r'(?P=indent)\{ pubkey: TOKEN_PROGRAM_ID, isSigner: false, isWritable: false \},',
              re.MULTILINE,
          )
          for path in tests:
              text = path.read_text()
              if 'platformWallet' not in text:
                  continue
              text, count = init_pattern.subn(
                  lambda m: (
                      f"{m.group('indent')}{{ pubkey: {m.group('who')}, isSigner: true, isWritable: true }},\n"
                      f"{m.group('indent')}{{ pubkey: platformWallet, isSigner: false, isWritable: true }},\n"
                      f"{m.group('indent')}{{ pubkey: TOKEN_PROGRAM_ID, isSigner: false, isWritable: false }},"
                  ),
                  text,
              )
              if count:
                  path.write_text(text)

          # Strengthen the main runtime smoke test: exact fee + wrong recipient.
          smoke = ROOT / 'apps/web/tests/bonding-curve-runtime-smoke.mjs'
          replace_once(
              smoke,
              'function initializeInstruction({ mint, curve, vault, rawSupply, decimals, creator = payer.publicKey }) {',
              'function initializeInstruction({ mint, curve, vault, rawSupply, decimals, creator = payer.publicKey, launchFeeRecipient = platformWallet }) {',
              'parameterize launch fee recipient',
          )
          replace_once(
              smoke,
              '      { pubkey: platformWallet, isSigner: false, isWritable: true },\n      { pubkey: TOKEN_PROGRAM_ID, isSigner: false, isWritable: false },',
              '      { pubkey: launchFeeRecipient, isSigner: false, isWritable: true },\n      { pubkey: TOKEN_PROGRAM_ID, isSigner: false, isWritable: false },',
              'use launch fee recipient parameter',
          )
          replace_once(
              smoke,
              '// Happy-path launch at exactly the protocol minimum.\nconst { mint, curve, vault } = await prepareMint();',
              '''// A direct caller cannot redirect or bypass the fixed launch fee.\n{\n  const prepared = await prepareMint();\n  await expectFailure('wrong launch fee recipient', async () => {\n    await sendAndConfirmTransaction(\n      connection,\n      new Transaction().add(initializeInstruction({\n        ...prepared,\n        rawSupply: RAW_SUPPLY,\n        decimals: DECIMALS,\n        launchFeeRecipient: payer.publicKey,\n      })),\n      [payer],\n      { commitment: 'confirmed' },\n    );\n  });\n}\n\n// Happy-path launch at exactly the protocol minimum.\nconst { mint, curve, vault } = await prepareMint();''',
              'add wrong launch fee recipient test',
          )
          replace_once(
              smoke,
              'assert(!(await connection.getAccountInfo(creatorAta, \'confirmed\')), \'creator has no automatic token account/allocation before trading\');\nawait sendAndConfirmTransaction(',
              'assert(!(await connection.getAccountInfo(creatorAta, \'confirmed\')), \'creator has no automatic token account/allocation before trading\');\nconst platformBeforeLaunch = BigInt(await connection.getBalance(platformWallet, \'confirmed\'));\nawait sendAndConfirmTransaction(',
              'capture platform balance before launch',
          )
          replace_once(
              smoke,
              '  { commitment: \'confirmed\' },\n);\n\nconst mintState = await getMint(connection, mint, \'confirmed\', TOKEN_PROGRAM_ID);',
              '  { commitment: \'confirmed\' },\n);\nconst platformAfterLaunch = BigInt(await connection.getBalance(platformWallet, \'confirmed\'));\n\nconst mintState = await getMint(connection, mint, \'confirmed\', TOKEN_PROGRAM_ID);',
              'capture platform balance after launch',
          )
          replace_once(
              smoke,
              "assert(!initial.complete && !initial.graduated, 'new curve begins active');\nconsole.log('✓ initialize verified: full supply under curve custody, creator automatic allocation = 0');",
              "assert(!initial.complete && !initial.graduated, 'new curve begins active');\nassert(platformAfterLaunch - platformBeforeLaunch === 1_000_000n, 'initialize pays exact 0.001 SOL launch fee to bound Signal wallet');\nconsole.log('✓ initialize verified: full supply under curve custody, creator automatic allocation = 0, 0.001 SOL launch fee enforced');",
              'assert exact launch fee',
          )

          # --- UI and docs: show the fee at the step where it is actually enforced. ---
          create = ROOT / 'apps/web/src/pages/CreatePage.tsx'
          replace_once(
              create,
              '2. Create mint + immutable metadata + 0.001 SOL SIGNAL launch fee',
              '2. Create mint + immutable metadata',
              'move launch fee step copy',
          )
          replace_once(
              create,
              '3. Mint full supply to curve vault + revoke mint authority + initialize curve',
              '3. Mint full supply to curve vault + revoke mint authority + initialize curve + 0.001 SOL SIGNAL launch fee',
              'show launch fee at curve initialization',
          )

          security_page = ROOT / 'apps/web/src/pages/SecurityPage.tsx'
          replace_once(
              security_page,
              "            Signal-created tokens use the classic SPL Token program. The fixed launch charge is separate from network,\n            metadata and account-creation costs shown by the wallet. Signal does not add a Token-2022 transfer tax.",
              "            Signal-created tokens use the classic SPL Token program. The bonding-curve program enforces the fixed launch\n            charge during curve initialization and binds its recipient to the Signal platform wallet. Network, metadata and\n            account-creation costs are separate. Signal does not add a Token-2022 transfer tax.",
              'clarify on-chain launch fee enforcement',
          )

          docs = ROOT / 'docs/SECURITY.md'
          replace_once(
              docs,
              '''3. The configured total supply is minted to the creator wallet.\n4. Mint authority is revoked after the supply is minted.\n5. Signal reads the mint back from chain and verifies the supply lock where possible before reporting the launch as complete.\n6. No freeze authority is configured for a new Signal-created token.\n\nAfter mint authority has been revoked and that state is confirmed on-chain, additional supply cannot be minted. Externally indexed tokens can have different authority settings and must be inspected independently.''',
              '''3. The configured total supply is minted directly into the program-owned bonding-curve token vault; the creator receives no automatic token allocation.\n4. Mint authority is revoked before the curve initialization is accepted, and no freeze authority is configured.\n5. The Signal bonding-curve program verifies supply, authorities and vault custody on-chain before creating curve state.\n6. 79.31% of supply is available for curve trading and 20.69% remains program-controlled for graduation liquidity.\n7. When the sale inventory reaches zero, curve trading closes and the reserved tokens plus accumulated curve SOL can graduate to Raydium CPMM.\n\nAfter mint authority has been revoked and confirmed on-chain, additional supply cannot be minted. Externally indexed tokens can have different authority settings and must be inspected independently.''',
              'correct security launch model',
          )
          replace_once(
              docs,
              'The current Solana launch transaction includes a fixed **0.001 SOL Signal launch fee** paid to the configured Signal platform wallet. Solana rent, network fees, metadata costs, and any approved storage payment are separate.',
              'The Signal bonding-curve program enforces a fixed **0.001 SOL Signal launch fee** during curve initialization and binds the recipient to the configured Signal platform wallet. A direct program caller cannot substitute another recipient or skip the fee. If initialization fails, the transaction rolls back atomically. Solana rent, network fees, metadata costs, and any approved storage payment are separate.',
              'document protocol launch fee',
          )
          replace_once(
              docs,
              '''- Solana buy execution is live in beta when Signal can build a valid route for the selected token and amount.\n- Solana sell execution is not yet implemented in-app; external market links are used where appropriate.\n- Base and BNB Chain discovery is live, while Signal token creation and in-app trading on those chains remain planned.''',
              '''- Before graduation, Signal-created curve tokens support non-custodial Solana buys and sells through the Signal bonding-curve program.\n- Completed curves migrate their reserved token inventory and available curve SOL to Raydium CPMM; post-graduation execution uses the available external-market route.\n- Base and BNB Chain discovery is live, while Signal token creation and in-app trading on those chains remain planned.''',
              'correct trading status docs',
          )

          # --- CI guard so a future browser-only fee cannot silently return. ---
          ci = ROOT / '.github/workflows/bonding-curve-ci.yml'
          replace_once(
              ci,
              "      - name: Guard curve-safe maximum supply\n",
              '''      - name: Guard launch fee at protocol layer\n        run: |\n          grep -F 'const LAUNCH_FEE_LAMPORTS: u64 = 1_000_000;' programs/signal-bonding-curve/src/lib.rs\n          grep -F 'platform_wallet.key != &PLATFORM_WALLET' programs/signal-bonding-curve/src/lib.rs\n          grep -F 'system_instruction::transfer(creator.key, platform_wallet.key, LAUNCH_FEE_LAMPORTS)' programs/signal-bonding-curve/src/lib.rs\n          grep -F '{ pubkey: PLATFORM_WALLET, isSigner: false, isWritable: true }' apps/web/src/client/launch-solana-curve.js\n          ! grep -F 'LAUNCH_FEE_LAMPORTS' apps/web/src/client/launch-solana-curve.js\n      - name: Guard curve-safe maximum supply\n''',
              'add launch fee CI guard',
          )

          # Sanity checks: every runtime initialize account list must now carry platformWallet.
          leftovers = []
          for path in tests:
              text = path.read_text()
              if init_pattern.search(text):
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Unpatched initialize account lists remain: ' + ', '.join(leftovers))

          print('Launch-fee hardening patch applied successfully.')
          PY

      - name: Basic syntax and Rust checks
        shell: bash
        run: |
          node --input-type=module --check < apps/web/src/client/launch-solana-curve.js
          for f in apps/web/tests/bonding-curve-*.mjs; do node --check "$f"; done
          cargo test --manifest-path programs/signal-bonding-curve/Cargo.toml
          git diff --check

      - name: Commit hardening to bonding-curve branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programs/signal-bonding-curve/src/lib.rs \
                  apps/web/src/client/launch-solana-curve.js \
                  apps/web/tests/bonding-curve-*.mjs \
                  apps/web/src/pages/CreatePage.tsx \
                  apps/web/src/pages/SecurityPage.tsx \
                  docs/SECURITY.md \
                  .github/workflows/bonding-curve-ci.yml
          git commit -m "Enforce launch fee in bonding curve program"
          git push origin HEAD:pf-style-bonding-curve
