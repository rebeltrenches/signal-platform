name: Wallet Intelligence verification

# verification trigger: history replay interaction

on:
  # Every push to main runs the full suite too, not only pull requests.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/indexer/**'
      - 'packages/blockchain/**'
      - 'apps/web/**'
      - 'functions/**'
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'packages/database/**'
      - '.github/workflows/wallet-intelligence-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signal_test
          POSTGRES_PASSWORD: signal_test
          POSTGRES_DB: signal_wallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signal_test -d signal_wallet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://signal_test:signal_test@localhost:5432/signal_wallet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --global pnpm@9.15.9
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: packages/database
        run: pnpm generate
      - name: Sync schema to isolated PostgreSQL
        working-directory: packages/database
        run: pnpm exec prisma7 db push
      - name: Wallet Intelligence repository tests
        run: pnpm exec tsx apps/api/tests/wallet-intelligence-repository.test.ts
      - name: Stage 3 funding ancestry tests
        run: pnpm exec tsx apps/api/tests/funding-ancestry.test.ts
      - name: Stage 3 funding ancestry API tests
        run: pnpm exec tsx apps/api/tests/funding-ancestry-route.test.ts
      - name: Stage 3 Signal Trace tests
        run: pnpm exec tsx apps/api/tests/signal-trace.test.ts
      - name: Stage 3 Signal Trace API tests
        run: pnpm exec tsx apps/api/tests/signal-trace-route.test.ts
      - name: Stage 3 wallet relationship cluster tests
        run: pnpm exec tsx apps/api/tests/wallet-relationship-clusters.test.ts
      - name: Stage 3 wallet relationship cluster API tests
        run: pnpm exec tsx apps/api/tests/wallet-relationship-clusters-route.test.ts
      - name: Stage 3 wallet project history tests
        run: pnpm exec tsx apps/api/tests/wallet-project-history.test.ts
      - name: Stage 3 wallet project history API tests
        run: pnpm exec tsx apps/api/tests/wallet-project-history-route.test.ts
      - name: Stage 3 Wallet History Replay tests
        run: pnpm exec tsx apps/api/tests/wallet-history-replay.test.ts
      - name: Stage 3 Wallet History Replay API tests
        run: pnpm exec tsx apps/api/tests/wallet-history-replay-route.test.ts
      - name: Stage 2 Solana relationship detector tests
        run: pnpm exec tsx apps/indexer/tests/solana-funding-relationship-worker.test.ts
      - name: Existing indexer regression tests
        run: pnpm --filter @launchpad/indexer test
      - name: Existing API regression tests
        run: |
          pnpm exec tsx apps/api/tests/router-security.test.ts
          pnpm exec tsx apps/api/tests/indexer-status.test.ts
          pnpm exec tsx apps/api/tests/token-repository.test.ts
          pnpm exec tsx apps/api/tests/watchlist-repository.test.ts
          pnpm exec tsx apps/api/tests/alert-repository.test.ts
      - name: Token registration ownership tests (C2)
        run: |
          pnpm exec tsx apps/api/tests/mint-creator-verification.test.ts
          pnpm exec tsx apps/api/tests/token-routes.test.ts
      - name: TypeScript verification
        run: pnpm typecheck
      - name: Bubble Map data tests
        run: pnpm exec tsx apps/web/tests/bubble-map-data.test.ts
      - name: Web build regression check
        run: pnpm --filter @launchpad/web build
      - name: Bundled wallet libraries test (C4)
        run: node apps/web/tests/wallet-vendor-bundle.test.mjs
      - name: Platform fee wallet single-source test
        run: node apps/web/tests/fee-wallet-config.test.mjs
      - name: Launch transaction integrity test (Phantom Mainnet additions)
        run: node apps/web/tests/launch-integrity.test.mjs
      - name: On-chain token metadata tests (Metaplex instruction, input rules)
        run: node apps/web/tests/token-metadata.test.mjs
      - name: Arweave upload tests (ANS-104 signing, Turbo free/paid fallback)
        run: |
          node apps/web/tests/ans104.test.mjs
          node apps/web/tests/turbo-upload.test.mjs
      - name: Cloudflare portfolio function regression test
        run: node apps/web/tests/cloudflare-portfolio-function.test.mjs
      - name: Signal X-Ray tests (checks, honeypot mints, cache, rate limit)
        run: node apps/web/tests/xray-function.test.mjs
      - name: Swap tamper check tests (Lighthouse guards allowed, anything else blocked)
        run: node apps/web/tests/swap-intent.test.mjs
      - name: Token market function tests (bonding curve, holders, logo, quota protection)
        run: node apps/web/tests/token-market-function.test.mjs
      - name: Regional restrictions and sanctions screening tests (Worker)
        run: |
          node apps/web/tests/compliance-functions.test.mjs
          node apps/web/tests/ofac-sdn.test.mjs
      - name: Cloudflare Worker syntax check
        run: |
          node --input-type=module --check < worker.js
          node --input-type=module --check < functions/api/solana/portfolio.js
          node --input-type=module --check < functions/api/solana/token-market.js
          node --input-type=module --check < functions/compliance.js
          node --input-type=module --check < functions/ofac-sdn.js
          node --input-type=module --check < functions/api/register-token.js
          node --input-type=module --check < functions/api/solana/xray.js
      - name: Wallet page regression test
        run: |
          python -m pip install playwright cryptography
          python -m playwright install --with-deps chromium
          python apps/web/tests/wallet-detail-tokens.test.py
      - name: Token page market data and Explore logo tests
        run: |
          python apps/web/tests/token-market-page.test.py
          python apps/web/tests/explore-logos.test.py
      - name: Terms, regional restrictions and sanctions screening tests (site)
        run: python apps/web/tests/compliance-page.test.py
      - name: Community chat, Explore and watchlist browser tests
        run: |
          python apps/web/tests/chat-e2e.test.py
          python apps/web/tests/explore-search.test.py
          python apps/web/tests/explore-new-tab.test.py
          python apps/web/tests/watchlist-registration-status.test.py
          python apps/web/tests/watchlist-sync.test.py
      - name: Signal X-Ray page tests (front page box, Signal Check tab, mobile)
        run: python apps/web/tests/xray-page.test.py
      - name: Token page Sell link (opens Jupiter, no Signal sell transaction)
        run: python apps/web/tests/sell-link.test.py
      - name: Safety boundary
        run: |
          echo "Wallet Intelligence verification completed against isolated CI resources."
          echo "No production database, wallet key, signer, transaction submission, or deployment is available to this job."
