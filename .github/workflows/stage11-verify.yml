name: Stage 11 verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/indexer/**'
      - 'apps/api/**'
      - 'packages/blockchain/**'
      - 'packages/database/**'
      - '.github/workflows/stage11-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'stage11-solana-indexer'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signal_test
          POSTGRES_PASSWORD: signal_test
          POSTGRES_DB: signal_stage11_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signal_test -d signal_stage11_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://signal_test:signal_test@localhost:5432/signal_stage11_test

    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install --global pnpm@9.15.9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/database
        run: pnpm generate

      - name: Sync schema to isolated PostgreSQL
        working-directory: packages/database
        run: pnpm exec prisma7 db push

      - name: Stage 11 indexer tests
        run: pnpm --filter @launchpad/indexer test

      - name: Utility regression tests
        run: pnpm test:utils

      - name: TypeScript verification
        run: pnpm typecheck

      - name: Web build regression check
        run: pnpm --filter @launchpad/web build

      - name: Confirm isolated indexer tables
        run: |
          PGPASSWORD=signal_test psql -h localhost -U signal_test -d signal_stage11_test -c "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('IndexerCheckpoint', 'IndexerRunState') ORDER BY table_name;"
          test "$(PGPASSWORD=signal_test psql -h localhost -U signal_test -d signal_stage11_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('IndexerCheckpoint', 'IndexerRunState');")" = "2"

      - name: Safety boundary
        run: |
          echo "CI verification complete."
          echo "No SOLANA_RPC_URL is provided to this job."
          echo "No live RPC pass, transaction signing, deployment, or production database access occurs here."


  live-rpc-readonly:
    if: github.head_ref == 'stage11-solana-indexer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signal_rpc
          POSTGRES_PASSWORD: signal_rpc
          POSTGRES_DB: signal_stage11_rpc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signal_rpc -d signal_stage11_rpc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://signal_rpc:signal_rpc@localhost:5432/signal_stage11_rpc_test
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install --global pnpm@9.15.9
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma client
        working-directory: packages/database
        run: pnpm generate
      - name: Sync schema to isolated PostgreSQL
        working-directory: packages/database
        run: pnpm exec prisma7 db push
      - name: Confirm RPC secret is present without printing it
        run: |
          test -n "$SOLANA_RPC_URL"
          echo "SOLANA_RPC_URL is configured."
      - name: Seed one known public Solana token
        env:
          PGPASSWORD: signal_rpc
        run: |
          psql -h localhost -U signal_rpc -d signal_stage11_rpc_test <<'SQL'
          INSERT INTO "Wallet" ("id","address","chain","createdAt") VALUES ('stage11-rpc-wallet','11111111111111111111111111111111','SOLANA',NOW());
          INSERT INTO "Token" ("id","chain","address","name","symbol","decimals","totalSupply","creatorId","createdAt","updatedAt")
          VALUES ('stage11-rpc-rebel','SOLANA','EzNLkZYFLGE2G5v1AWXvcnrb54WxrkD7Syrxxch7pump','REBEL','REBEL',6,0,'stage11-rpc-wallet',NOW(),NOW());
          SQL
      - name: Run exactly one read-only Solana indexing pass
        run: pnpm --filter @launchpad/indexer solana:once
      - name: Verify live RPC persistence
        env:
          PGPASSWORD: signal_rpc
        run: |
          psql -h localhost -U signal_rpc -d signal_stage11_rpc_test -c "SELECT \"holderCount\",\"top10HolderPercent\",\"mintAuthorityActive\",\"freezeAuthorityActive\",\"lastIndexedAt\" FROM \"TokenMetadata\" WHERE \"tokenId\"='stage11-rpc-rebel';"
          psql -h localhost -U signal_rpc -d signal_stage11_rpc_test -c "SELECT COUNT(*) AS holder_rows FROM \"Holder\" WHERE \"tokenId\"='stage11-rpc-rebel';"
          psql -h localhost -U signal_rpc -d signal_stage11_rpc_test -c "SELECT \"attempted\",\"refreshed\",\"failed\",\"lastCompletedAt\",\"lastError\" FROM \"IndexerRunState\" WHERE \"key\"='solana-token-refresh';"
          test "$(psql -h localhost -U signal_rpc -d signal_stage11_rpc_test -Atc "SELECT COUNT(*) FROM \"TokenMetadata\" WHERE \"tokenId\"='stage11-rpc-rebel' AND \"lastIndexedAt\" IS NOT NULL;")" = "1"
          test "$(psql -h localhost -U signal_rpc -d signal_stage11_rpc_test -Atc "SELECT \"attempted\" FROM \"IndexerRunState\" WHERE \"key\"='solana-token-refresh';")" = "1"
          test "$(psql -h localhost -U signal_rpc -d signal_stage11_rpc_test -Atc "SELECT \"refreshed\" FROM \"IndexerRunState\" WHERE \"key\"='solana-token-refresh';")" = "1"
          test "$(psql -h localhost -U signal_rpc -d signal_stage11_rpc_test -Atc "SELECT \"failed\" FROM \"IndexerRunState\" WHERE \"key\"='solana-token-refresh';")" = "0"
      - name: Safety statement
        run: |
          echo "One read-only Solana RPC indexing pass completed against ephemeral PostgreSQL."
          echo "No signer, wallet key, seed phrase, transaction submission, deployment, or production database is available to this job."
