name: Stage 11 verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/indexer/**'
      - 'apps/api/**'
      - 'packages/blockchain/**'
      - 'packages/database/**'
      - '.github/workflows/stage11-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'stage11-solana-indexer'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signal_test
          POSTGRES_PASSWORD: signal_test
          POSTGRES_DB: signal_stage11_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signal_test -d signal_stage11_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://signal_test:signal_test@localhost:5432/signal_stage11_test

    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/database
        run: pnpm generate

      - name: Sync schema to isolated PostgreSQL
        working-directory: packages/database
        run: pnpm exec prisma7 db push --skip-generate

      - name: Stage 11 indexer tests
        run: pnpm --filter @launchpad/indexer test

      - name: Utility regression tests
        run: pnpm test:utils

      - name: TypeScript verification
        run: pnpm typecheck

      - name: Web build regression check
        run: pnpm --filter @launchpad/web build

      - name: Confirm isolated indexer tables
        run: |
          PGPASSWORD=signal_test psql -h localhost -U signal_test -d signal_stage11_test -c '\\d "IndexerCheckpoint"'
          PGPASSWORD=signal_test psql -h localhost -U signal_test -d signal_stage11_test -c '\\d "IndexerRunState"'

      - name: Safety boundary
        run: |
          echo "CI verification complete."
          echo "No SOLANA_RPC_URL is provided to this job."
          echo "No live RPC pass, transaction signing, deployment, or production database access occurs here."
