name: Bonding curve CI

on:
  push:
    branches:
      - pf-style-bonding-curve
    paths:
      - 'programs/signal-bonding-curve/**'
      - 'apps/web/src/client/launch-solana-curve.js'
      - 'apps/web/src/client/trade-router.js'
      - 'apps/web/tests/bonding-curve-final-fill-size.mjs'
      - 'apps/web/tests/bonding-curve-runtime-smoke.mjs'
      - 'apps/web/tests/bonding-curve-completion-runtime.mjs'
      - 'apps/web/src/pages/CreatePage.tsx'
      - 'apps/web/src/pages/SecurityPage.tsx'
      - 'apps/web/src/pages/TermsPage.tsx'
      - 'apps/web/scripts/build.tsx'
      - 'config/restrictions.json'
      - 'docs/SECURITY.md'
      - '.github/workflows/bonding-curve-ci.yml'
  pull_request:
    paths:
      - 'programs/signal-bonding-curve/**'
      - 'apps/web/src/client/launch-solana-curve.js'
      - 'apps/web/src/client/trade-router.js'
      - 'apps/web/tests/bonding-curve-final-fill-size.mjs'
      - 'apps/web/tests/bonding-curve-runtime-smoke.mjs'
      - 'apps/web/tests/bonding-curve-completion-runtime.mjs'
      - 'apps/web/src/pages/CreatePage.tsx'
      - 'apps/web/src/pages/SecurityPage.tsx'
      - 'apps/web/src/pages/TermsPage.tsx'
      - 'apps/web/scripts/build.tsx'
      - 'config/restrictions.json'
      - 'docs/SECURITY.md'
      - '.github/workflows/bonding-curve-ci.yml'

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Signal bonding curve math and state
        run: cargo test --manifest-path programs/signal-bonding-curve/Cargo.toml
      - name: Compile Signal bonding curve program
        run: cargo check --manifest-path programs/signal-bonding-curve/Cargo.toml

  sbf-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official Agave / Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Show Solana toolchain version
        run: solana --version
      - name: Build deployable Signal bonding curve SBF
        working-directory: programs/signal-bonding-curve
        run: cargo build-sbf
      - name: Verify deployable program artifact
        run: test -s programs/signal-bonding-curve/target/deploy/signal_bonding_curve.so
      - name: Upload program binary only
        uses: actions/upload-artifact@v4
        with:
          name: signal-bonding-curve-sbf
          path: programs/signal-bonding-curve/target/deploy/signal_bonding_curve.so
          if-no-files-found: error
          retention-days: 7

  web-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      # apps/web is CommonJS only for its Node build script; the files below
      # are loaded by browsers as ESM. Feed them to Node as module source so
      # the syntax check uses the same grammar the browser does.
      - name: Check curve browser module syntax
        run: |
          node --input-type=module --check < apps/web/src/client/launch-solana-curve.js
          node --input-type=module --check < apps/web/src/client/trade-router.js
      - name: Build Signal web app
        run: pnpm --filter @launchpad/web build
      - name: Verify curve browser dependencies were built
        run: |
          test -f apps/web/dist/client/launch-solana-curve.js
          test -f apps/web/dist/client/trade-router.js
          test -f apps/web/dist/client/platform-wallet.js
          test -f apps/web/dist/client/bonding-curve-program.js
          test -f apps/web/dist/client/vendor/solana-web3.js
          test -f apps/web/dist/client/vendor/spl-token.js
      - name: Keep Rust and browser curve state layouts identical
        run: |
          grep -F 'const STATE_LEN: usize = 160;' programs/signal-bonding-curve/src/lib.rs
          grep -F 'const STATE_VERSION: u8 = 2;' programs/signal-bonding-curve/src/lib.rs
          grep -F 'const CURVE_STATE_LEN = 160;' apps/web/src/client/launch-solana-curve.js
          grep -F 'const CURVE_STATE_VERSION = 2;' apps/web/src/client/launch-solana-curve.js
          grep -F 'const STATE_LEN = 160;' apps/web/src/client/trade-router.js
          grep -F 'const STATE_VERSION = 2;' apps/web/src/client/trade-router.js
      - name: Guard protocol minimum and dust-trade parity
        run: |
          grep -F 'const MINIMUM_TOKEN_SUPPLY_WHOLE: u64 = 100_000_000;' programs/signal-bonding-curve/src/lib.rs
          grep -F 'validate_initial_supply(total_supply, decimals)?;' programs/signal-bonding-curve/src/lib.rs
          grep -F 'const MINIMUM_TOKEN_SUPPLY = 100_000_000n;' apps/web/src/client/launch-solana-curve.js
          grep -F 'if (tradeFee <= 0n || tradeFee >= gross) throw new Error("Amount is too small.");' apps/web/src/client/trade-router.js
      - name: Guard curve-safe maximum supply
        run: |
          grep -F 'const INITIAL_VIRTUAL_BPS = 10_730n;' apps/web/src/client/launch-solana-curve.js
          grep -F 'const MAX_CURVE_RAW_SUPPLY = ((U64_MAX + 1n) * BPS - 1n) / INITIAL_VIRTUAL_BPS;' apps/web/src/client/launch-solana-curve.js
      - name: Guard Raydium graduation wiring
        run: |
          grep -F 'CPMMoo8L3F4NbTegBCKVNunggL7H1ZpdTHKxQB5qKP1C' apps/web/src/client/trade-router.js
          grep -F 'Graduate to Raydium' apps/web/src/client/trade-router.js
          grep -F 'Some(GRADUATE_TO_RAYDIUM)' programs/signal-bonding-curve/src/lib.rs
      - name: Guard atomic final-fill graduation
        run: |
          grep -F 'const finalFill = q.tokens === s.realTokens;' apps/web/src/client/trade-router.js
          grep -F 'quote.finalFill ? GRADUATION_COMPUTE_LIMIT : COMPUTE_LIMIT' apps/web/src/client/trade-router.js
          grep -F 'instructions.push(graduation.instruction);' apps/web/src/client/trade-router.js
          grep -F 'one atomic transaction' apps/web/src/client/trade-router.js
      - name: Verify final-fill transaction fits Solana packet size
        working-directory: apps/web
        run: node tests/bonding-curve-final-fill-size.mjs
      - name: Confirm full supply goes to curve vault, never creator wallet
        run: |
          grep -F 'createMintToInstruction(mint, vault, payer, rawSupply' apps/web/src/client/launch-solana-curve.js
          grep -F 'creator received 0 tokens automatically' apps/web/src/client/launch-solana-curve.js
          ! grep -F "moduleScripts: ['/client/launch-solana.js'" apps/web/scripts/build.tsx
          grep -F "/client/launch-solana-curve.js" apps/web/scripts/build.tsx
          grep -F "/client/trade-router.js" apps/web/scripts/build.tsx

  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install official Agave / Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build runtime program
        working-directory: programs/signal-bonding-curve
        run: cargo build-sbf
      - name: Start isolated Solana validator with Signal program
        run: |
          solana-keygen new --no-bip39-passphrase --silent --force -o /tmp/signal-runtime-payer.json
          solana-keygen new --no-bip39-passphrase --silent --force -o /tmp/signal-runtime-program.json
          PROGRAM_ID="$(solana-keygen pubkey /tmp/signal-runtime-program.json)"
          echo "SIGNAL_RUNTIME_PROGRAM_ID=$PROGRAM_ID" >> "$GITHUB_ENV"
          echo "SIGNAL_RUNTIME_PAYER=/tmp/signal-runtime-payer.json" >> "$GITHUB_ENV"
          solana-test-validator \
            --reset \
            --quiet \
            --bpf-program "$PROGRAM_ID" programs/signal-bonding-curve/target/deploy/signal_bonding_curve.so \
            >/tmp/signal-validator.log 2>&1 &
          echo $! >/tmp/signal-validator.pid
          for attempt in $(seq 1 30); do
            if solana cluster-version --url http://127.0.0.1:8899 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          solana cluster-version --url http://127.0.0.1:8899
          solana airdrop 20 --keypair /tmp/signal-runtime-payer.json --url http://127.0.0.1:8899
          solana balance --keypair /tmp/signal-runtime-payer.json --url http://127.0.0.1:8899
      - name: Execute initialize, buy, rejection and sell paths on Solana runtime
        working-directory: apps/web
        env:
          SIGNAL_RUNTIME_RPC: http://127.0.0.1:8899
        run: node tests/bonding-curve-runtime-smoke.mjs
      - name: Execute exact full-curve completion on Solana runtime
        working-directory: apps/web
        env:
          SIGNAL_RUNTIME_RPC: http://127.0.0.1:8899
        run: node tests/bonding-curve-completion-runtime.mjs
      - name: Show validator log on failure
        if: failure()
        run: tail -n 300 /tmp/signal-validator.log || true
      - name: Stop local validator
        if: always()
        run: |
          if [ -f /tmp/signal-validator.pid ]; then kill "$(cat /tmp/signal-validator.pid)" 2>/dev/null || true; fi
