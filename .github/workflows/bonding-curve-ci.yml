name: Bonding curve CI

on:
  push:
    branches:
      - pf-style-bonding-curve
    paths:
      - 'programs/signal-bonding-curve/**'
      - 'apps/web/src/client/launch-solana-curve.js'
      - 'apps/web/src/client/trade-router.js'
      - 'apps/web/src/pages/CreatePage.tsx'
      - 'apps/web/scripts/build.tsx'
      - '.github/workflows/bonding-curve-ci.yml'
  pull_request:
    paths:
      - 'programs/signal-bonding-curve/**'
      - 'apps/web/src/client/launch-solana-curve.js'
      - 'apps/web/src/client/trade-router.js'
      - 'apps/web/src/pages/CreatePage.tsx'
      - 'apps/web/scripts/build.tsx'
      - '.github/workflows/bonding-curve-ci.yml'

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Signal bonding curve math and state
        run: cargo test --manifest-path programs/signal-bonding-curve/Cargo.toml

  web-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Build Signal web app
        run: pnpm --filter @launchpad/web build
      - name: Parse curve launch client as a browser module
        run: pnpm exec esbuild apps/web/src/client/launch-solana-curve.js --bundle --format=esm --platform=browser '--external:./vendor/*' --outfile=/tmp/launch-solana-curve.js
      - name: Parse curve trade router as a browser module
        run: pnpm exec esbuild apps/web/src/client/trade-router.js --bundle --format=esm --platform=browser '--external:./vendor/*' --outfile=/tmp/trade-router.js
      - name: Confirm legacy full-supply launcher is not wired into Create
        run: |
          if grep -F "moduleScripts: ['/client/launch-solana.js'" apps/web/scripts/build.tsx; then
            echo 'Legacy full-supply launch flow is still wired into Create.'
            exit 1
          fi
          grep -F "/client/launch-solana-curve.js" apps/web/scripts/build.tsx
          grep -F "/client/trade-router.js" apps/web/scripts/build.tsx
